name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage
        run: ./portable2appimage APP-MANAGER APP-MANAGER 10.5 "ivan-hc|AM|latest"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag }}
          artifacts: "*.AppImage,*.AppImage.zsync"
          token: ${{ secrets.GITHUB_TOKEN }}
